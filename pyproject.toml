[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snowflake-pii-scanner"
version = "0.1.0"
description = "Identify Snowflake columns likely to contain PII, without pulling raw data out of Snowflake"
requires-python = ">=3.9"
dependencies = [
    "snowflake-connector-python>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
snowflake-pii-scan = "snowflake_pii_scanner.cli:main"

[tool.setuptools]
packages = ["snowflake_pii_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests/pii_scanner"]
